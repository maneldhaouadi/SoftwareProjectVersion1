{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Inviter des collaborateurs</h2>
  <p><strong>Tâche:</strong> {{ tache.description }} — échéance {{ tache.date_echeance }}</p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Collaborateurs (Médecins/Infirmières)</label>
      {{ form.collaborators }}
      <div class="form-text">Sélection multiple possible. Les invités recevront une invitation à accepter.</div>
    </div>
    <button class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'tache:doctor_list_taches' %}" class="btn btn-secondary ms-2">Annuler</a>
  </form>
</div>
{% endblock %}
